<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Arena Ki Fighters</title>
  <style>
    :root {
      --bg: #07111f;
      --ink: #e8eef7;
      --muted: #9fb3c8;
      --accent: #38bdf8;
      --hot: #fb7185;
      --ok: #4ade80;
      --sun: #fde047;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: "Trebuchet MS", system-ui, sans-serif; overflow: hidden;
      touch-action: manipulation;
    }
    #app { height: 100%; display: flex; flex-direction: column; }
    .screen { display: none; flex: 1; flex-direction: column; padding: 20px 18px env(safe-area-inset-bottom); overflow: auto; }
    .screen.on { display: flex; }
    .brand { color: var(--sun); font-weight: 800; letter-spacing: .18em; font-size: .75rem; }
    h1 { margin: 10px 0; font-size: 2rem; line-height: 1.05; }
    p { color: var(--muted); line-height: 1.4; }
    .btn {
      display: block; width: 100%; margin: 8px 0; padding: 14px;
      border-radius: 999px; border: 1px solid rgba(125,211,252,.35);
      background: rgba(15,23,42,.7); color: var(--ink); font-weight: 800; font-size: 1rem;
    }
    .btn.primary { background: linear-gradient(120deg, #38bdf8, #fde047); color: #0b1220; border: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card {
      border: 2px solid #334155; border-radius: 14px; padding: 10px; background: rgba(15,23,42,.75); text-align: left; color: inherit;
    }
    .card.on { border-color: var(--sun); }
    .swatch { height: 42px; border-radius: 10px; margin-bottom: 6px; }
    .card strong { display: block; }
    .card small { color: var(--muted); }
    #combat { padding: 8px; gap: 6px; overflow: hidden; }
    #frameWrap {
      flex: 1; min-height: 38vh; border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(125,211,252,.35); background: #0b1d3a;
      position: relative;
    }
    
  html,body{margin:0;height:100%;background:#07111f;overflow:hidden}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{background:#0b1d3a;max-width:100%;max-height:100%}

    #wrap { width: 100%; height: 100%; display:flex; align-items:center; justify-content:center; }
    canvas { max-width: 100%; max-height: 100%; background:#0b1d3a; }
    #stage { text-align: center; color: var(--muted); font-size: .8rem; font-weight: 700; }
    #log { font-size: .7rem; color: #94a3b8; white-space: nowrap; overflow: auto; min-height: 1.2em; }
    .controls { display: flex; justify-content: space-between; gap: 8px; }
    .pad, .acts { display: flex; flex-wrap: wrap; gap: 8px; }
    .hold {
      min-width: 64px; min-height: 54px; border-radius: 14px; border: 2px solid rgba(125,211,252,.45);
      background: rgba(15,23,42,.9); color: #fff; font-weight: 800;
    }
    .hold:active { background: rgba(56,189,248,.35); }
    .reward {
      border: 1px solid rgba(253,224,71,.45); border-radius: 16px; padding: 14px; background: rgba(15,23,42,.7);
    }
  </style>
</head>
<body>
  <div id="app">
    <section id="home" class="screen on">
      <div class="brand">ARENA KI FIGHTERS</div>
      <h1>Smash doux.<br/>Ki explosif.</h1>
      <p>Jouable sur téléphone. Remplis le ki puis lance ULTRA.</p>
      <button class="btn primary" id="goPlay">Jouer 1v1 vs IA</button>
      <button class="btn" id="goChars">Choisir mon perso</button>
    </section>

    <section id="chars" class="screen">
      <div class="brand">PERSONNAGES</div>
      <h1>Ton combattant</h1>
      <div class="grid" id="charGrid"></div>
      <button class="btn primary" id="startFromChars">Lancer</button>
      <button class="btn" data-back="home">Retour</button>
    </section>

    <section id="combat" class="screen">
      <div id="frameWrap">
        <div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
      </div>
      <div id="stage">Arène</div>
      <div id="log"></div>
      <div class="controls">
        <div class="pad">
          <button class="hold" data-hold="left" type="button">◀</button>
          <button class="hold" data-hold="right" type="button">▶</button>
          <button class="hold" data-hold="jump" type="button">Jump</button>
        </div>
        <div class="acts">
          <button class="hold" data-hold="attack" type="button" style="border-color:#fde047">Atk</button>
          <button class="hold" data-hold="special" type="button" style="border-color:#38bdf8">Spé</button>
          <button class="hold" data-hold="ultra" type="button" style="border-color:#fb7185">ULTRA</button>
          <button class="hold" data-hold="regen" type="button" style="border-color:#4ade80">Regen</button>
        </div>
      </div>
      <button class="btn" id="forfeit" type="button">Abandonner</button>
    </section>

    <section id="victory" class="screen">
      <div class="brand">VICTOIRE</div>
      <h1 id="winTitle">Gagnant</h1>
      <div class="reward">
        <strong style="color:var(--sun)">Récompense</strong>
        <p id="rewardText">—</p>
      </div>
      <button class="btn primary" data-back="home" type="button">Menu</button>
    </section>
  </div>

  <script>
    const CHARS = [
      { id:'lumo', name:'Lumo', tag:'Alien doux', body:'#7dd3fc', accent:'#fef08a' },
      { id:'pebble', name:'Pebble', tag:'Roc ronron', body:'#a8a29e', accent:'#84cc16' },
      { id:'nori', name:'Nori', tag:'Wok de ki', body:'#fb7185', accent:'#fdba74' },
      { id:'capra', name:'Capra', tag:'Chèvre pirate', body:'#c4b5fd', accent:'#f472b6' },
      { id:'mossy', name:'Mossy', tag:'Gardien', body:'#4ade80', accent:'#a3e635' },
      { id:'zib', name:'Zib', tag:'Chaos rose', body:'#f9a8d4', accent:'#67e8f9' },
      { id:'kira', name:'Kira', tag:'Poing solaire', body:'#fde047', accent:'#38bdf8' },
      { id:'bolt', name:'Bolt', tag:'Écureuil', body:'#fdba74', accent:'#facc15' }
    ];
    const PROMPTS = [
      'Inventе un snack qui recharge le ki en trois bouchées.',
      'Décris une arène flottante faite de nuages caramel.',
      'Imagine une danse de victoire ridicule mais magnifique.',
      'Propose un nom de technique spéciale jamais vue.',
      'Écris un haiku sur un smash qui rate comiquement.',
      'Design un stage avec des trampolines de gelée.',
      'Crée un duo 2v2 nommé Sucre & Foudre.',
      'Imagine un podcast animé par deux aliens pelucheux.'
    ].map(s => s.replace(/\u0435/g,'e'));

    let me = 'lumo';
    let moveX = 0;
    let fighting = false;

    const $ = (id) => document.getElementById(id);
    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
      $(id).classList.add('on');
    }

    // Bridge: game posts via ReactNativeWebView or we patch post
    const inbox = [];
    function handleGameMsg(data) {
      if (!data?.type) return;
      if (data.type === 'ready') $('stage').textContent = data.stage || 'Arène';
      if (data.type === 'log') $('log').textContent = (data.log || []).map(l => l.msg).slice(0, 2).join(' · ');
      if (data.type === 'ended') {
        fighting = false;
        const winners = new Set(data.winnerTeams || []);
        const names = (data.fighters || []).filter(f => winners.has(f.team)).map(f => f.name).join(' & ');
        $('winTitle').textContent = names || 'Match terminé';
        $('rewardText').textContent = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
        show('victory');
      }
    }

    // Intercept game -> host messages without postMessage('*')
    window.ReactNativeWebView = {
      postMessage(raw) {
        try { handleGameMsg(JSON.parse(raw)); } catch (_) {}
      }
    };

    function send(msg) {
      if (window.AKI && typeof window.AKI.onMessage === 'function') {
        window.AKI.onMessage(msg);
      }
    }

    function sendInput(extra = {}) {
      send({ type: 'input', slot: 0, input: { moveX, ...extra } });
    }

    function renderChars() {
      const grid = $('charGrid');
      grid.innerHTML = '';
      CHARS.forEach(c => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'card' + (me === c.id ? ' on' : '');
        b.innerHTML = '<div class="swatch" style="background:linear-gradient(135deg,'+c.body+','+c.accent+')"></div><strong>'+c.name+'</strong><small>'+c.tag+'</small>';
        b.onclick = () => { me = c.id; renderChars(); };
        grid.appendChild(b);
      });
    }

    function startCombat() {
      show('combat');
      fighting = true;
      const foe = CHARS.find(c => c.id !== me) || CHARS[1];
      send({
        type: 'start',
        config: {
          mode: '1v1',
          stocks: 3,
          fighters: [
            { id:'p0', slot:0, team:0, characterId: me, name: CHARS.find(c=>c.id===me).name, stocks:3 },
            { id:'p1', slot:1, team:1, characterId: foe.id, name: foe.name, stocks:3 }
          ]
        }
      });
    }

    setInterval(() => {
      if (!fighting || !$('combat').classList.contains('on')) return;
      send({
        type: 'input',
        slot: 1,
        input: {
          moveX: Math.random() > 0.5 ? 1 : -1,
          jump: Math.random() > 0.92,
          attack: Math.random() > 0.85,
          special: Math.random() > 0.95,
          ultra: Math.random() > 0.985
        }
      });
    }, 180);

    function bindHold(el, on, off) {
      const start = (ev) => { ev.preventDefault(); on(); };
      const end = (ev) => { ev.preventDefault(); off(); };
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', end);
      el.addEventListener('touchcancel', end);
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('mouseleave', end);
    }

    document.querySelectorAll('[data-hold]').forEach((el) => {
      const k = el.getAttribute('data-hold');
      if (k === 'left') bindHold(el, () => { moveX = -1; sendInput({ moveX: -1 }); }, () => { moveX = 0; sendInput({ moveX: 0 }); });
      else if (k === 'right') bindHold(el, () => { moveX = 1; sendInput({ moveX: 1 }); }, () => { moveX = 0; sendInput({ moveX: 0 }); });
      else bindHold(el, () => sendInput({ [k]: true }), () => sendInput({ [k]: false }));
    });

    $('goPlay').onclick = startCombat;
    $('goChars').onclick = () => { renderChars(); show('chars'); };
    $('startFromChars').onclick = startCombat;
    $('forfeit').onclick = () => send({ type: 'forfeit' });
    document.querySelectorAll('[data-back]').forEach((b) => b.onclick = () => show(b.getAttribute('data-back')));
    renderChars();
